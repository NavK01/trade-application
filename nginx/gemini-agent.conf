# Nginx Configuration for Gemini Quant Agent & Multimodal Live Voice Bridge
# Place this file in /etc/nginx/sites-available/gemini-agent
# and symlink to /etc/nginx/sites-enabled/gemini-agent

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gemini_backend {
    server 127.0.0.1:7000;
    keepalive 32;
}

server {
    listen 80;
    server_name crimson.southindia.cloudapp.azure.com _ localhost;

    client_max_body_size 100M;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Root location: Proxy everything to FastAPI / Uvicorn
    location / {
        proxy_pass http://gemini_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket location for all live streams (Live Voice, 5-Min Predictor, Market Feed, Agent Logs)
    location /ws/ {
        proxy_pass http://gemini_backend;
        proxy_http_version 1.1;
        
        # Essential WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering and enable persistent long-running audio/agent streaming
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
